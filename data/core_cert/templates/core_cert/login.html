{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - AgnCert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v={% now 'U' %}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-body);
            margin: 0;
        }
        .login-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--card-border);
        }
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .login-header h1 {
            color: var(--brand-color);
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1.5px;
        }
        .login-header p {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 0.95rem;
        }
        .form-label {
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.9rem;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 700;
            margin-top: 15px;
            background-color: var(--accent);
            border: none;
        }
        .error-msg {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .form-control {
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--input-text);
            padding: 12px;
        }
        .form-control:focus {
            background-color: var(--input-bg);
            border-color: var(--accent);
            color: var(--input-text);
            box-shadow: 0 0 0 0.25rem rgba(13, 202, 240, 0.25);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>AgnCERT</h1>
            <p>SSL Certificate Management System</p>
        </div>

        {% if form.errors %}
        <div class="error-msg">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">아이디</label>
                <input type="text" name="username" id="id_username" class="form-control" placeholder="Username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="id_password" class="form-label">비밀번호</label>
                <input type="password" name="password" id="id_password" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-login btn-primary">로그인</button>
        </form>
    </div>
</body>
</html>
